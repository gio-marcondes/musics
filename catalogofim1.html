<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Oficial - DJ Mike</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0b1120;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
      --gold: #fbbf24;
      --heart: #f43f5e;
      --success: #22c55e;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1440px;
    }

    .header {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-wrapper {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      width: 260px;
      transition: all 0.2s ease;
    }

    .search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .fav-filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .fav-filter-btn:hover {
      border-color: var(--heart);
      color: var(--heart);
    }

    .fav-filter-btn.active {
      background: rgba(244, 63, 94, 0.15);
      border-color: var(--heart);
      color: var(--heart);
    }

    .table-wrapper {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead {
      background-color: #0b1120;
      user-select: none;
    }

    th {
      padding: 1rem 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease;
      border-bottom: 1px solid var(--border-color);
    }

    th:hover {
      color: var(--accent);
    }

    th.sorted-asc::after {
      content: ' ▲';
      color: var(--accent);
      font-size: 0.75rem;
    }

    th.sorted-desc::after {
      content: ' ▼';
      color: var(--accent);
      font-size: 0.75rem;
    }

    tbody tr.track-row {
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    tbody tr.track-row:hover {
      background-color: rgba(56, 189, 248, 0.08);
    }

    tbody tr.track-row.is-playing {
      background-color: rgba(56, 189, 248, 0.15);
    }

    tbody tr.track-row.is-expanded {
      background-color: rgba(56, 189, 248, 0.1);
      border-bottom: none;
    }

    td {
      padding: 0.85rem 0.8rem;
      vertical-align: middle;
    }

    .rank-col {
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      font-size: 0.95rem;
      width: 45px;
    }

    .rank-col.top-3 {
      color: var(--gold);
    }

    .track-title {
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .expand-indicator {
      font-size: 0.7rem;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }

    tr.track-row.is-expanded .expand-indicator {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .score-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.82rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .score-badge.top-1 {
      background: rgba(251, 191, 36, 0.15);
      color: var(--gold);
      border-color: rgba(251, 191, 36, 0.4);
    }

    .artist-reference {
      font-size: 0.82rem;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .artist-tag {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.76rem;
      background: rgba(129, 140, 248, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }

    .quote-text {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .badge-status {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text-main);
      white-space: nowrap;
    }

    .play-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }

    .play-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .play-btn.playing {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    .heart-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #475569;
      cursor: pointer;
      transition: transform 0.15s ease, color 0.2s ease;
      outline: none;
      padding: 0.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .heart-btn:hover {
      transform: scale(1.2);
      color: var(--heart);
    }

    .heart-btn.is-fav {
      color: var(--heart);
      filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.4));
    }

    tr.accordion-row {
      display: none;
      background-color: #0d1527;
      border-bottom: 1px solid var(--border-color);
    }

    tr.accordion-row.open {
      display: table-row;
    }

    .accordion-content {
      padding: 1.3rem 1.6rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1100px) {
      .accordion-content {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 680px) {
      .accordion-content {
        grid-template-columns: 1fr;
      }
    }

    .detail-box {
      background: var(--card-inner);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.85rem;
    }

    .detail-box.lyrics-box {
      grid-column: 1 / -1;
      border: 1px solid rgba(56, 189, 248, 0.2);
      background: #090e1a;
    }

    .lyrics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .lyrics-textarea {
      width: 100%;
      min-height: 180px;
      background: #0d1527;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .lyrics-textarea:focus {
      border-color: var(--accent);
    }

    .save-lyrics-btn {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .save-lyrics-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .save-lyrics-btn.saved {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .detail-value {
      font-size: 0.85rem;
      color: var(--text-main);
      line-height: 1.4;
    }
  </style>
</head>

  <div class="header">

    </table>
  </div>
</div>

      status: "Média (Nicho Verão)",
      curiosidades: "Criada na linha despretensiosa do reggae acústico e pop praiano nacional.",

      mixagem: "Mix leve com destaque para a percussão de luau e violão acústico.",
      instrumentos: "Violão de nylon, cajón/percussão praiana e baixo leve.",
      potenciaVocal: "Canto descontraído, solto e sem grandes exigências técnicas.",
      sentimento: "Nostalgia doce, sol, praia e romance despretensioso.",
      publico: "Jovens apreciadores de pop praiano, luau e música de viagem de férias.",
      potencial: "Bares de praia, playlists de luau/verão e churrascos com amigos.",
      lyrics: `Você se lembra daquele fim de tarde na praia?

  const tbody = document.getElementById('catalogTbody');
  const STORAGE_FAVS = 'djmike_favorite_tracks';
  const STORAGE_LYRICS = 'djmike_custom_lyrics';

  let favorites = JSON.parse(localStorage.getItem(STORAGE_FAVS) || '[]');
  let customLyrics = JSON.parse(localStorage.getItem(STORAGE_LYRICS) || '{}');
  let onlyFavsActive = false;

  function renderTable() {
    tbody.innerHTML = '';
    TRACKS_DATA.forEach((track, index) => {
      const rankNum = index + 1;
      const rankClass = rankNum <= 3 ? 'rank-col top-3' : 'rank-col';
      const isFav = favorites.includes(track.id);
      const scoreBadgeClass = track.top ? 'score-badge top-1' : 'score-badge';
      const audioFileName = `${track.title.trim()}.m4a`; // Suporta .m4a e .mp3
      const currentLyric = customLyrics[track.id] || track.lyrics || "";

      const trTrack = document.createElement('tr');
      trTrack.className = 'track-row';
      trTrack.setAttribute('data-id', track.id);
      trTrack.setAttribute('data-title', track.title);
      trTrack.setAttribute('data-audio', audioFileName);

      trTrack.innerHTML = `
        <td class="${rankClass}">#${rankNum}</td>
        <td style="text-align: center;"><button class="heart-btn ${isFav ? 'is-fav' : ''}" title="Favoritar">${isFav ? '❤️' : '🤍'}</button></td>
        <td><button class="play-btn">▶ Tocar</button></td>
        <td class="track-title">${track.title} <span class="expand-indicator">▼</span></td>
        <td><span class="${scoreBadgeClass}">${track.score}</span></td>
        <td class="artist-reference"><span class="artist-tag">${track.artistRef}</span></td>
        <td>${track.theme}</td>
        <td class="quote-text">${track.quote}</td>
        <td>${track.ideal}</td>
        <td><span class="badge-status">${track.status}</span></td>
      `;

      const trAccordion = document.createElement('tr');
      trAccordion.className = 'accordion-row';
      trAccordion.setAttribute('data-for', track.id);
      trAccordion.innerHTML = `
        <td colspan="10">
          <div class="accordion-content">
            <div class="detail-box"><div class="detail-label">💡 Curiosidades</div><div class="detail-value">${track.curiosidades}</div></div>
            <div class="detail-box"><div class="detail-label">🌟 Pontos Fortes</div><div class="detail-value">${track.pontosFortes}</div></div>
            <div class="detail-box"><div class="detail-label">🎛️ Mixagem & Produção</div><div class="detail-value">${track.mixagem}</div></div>
            <div class="detail-box"><div class="detail-label">🎸 Instrumentos</div><div class="detail-value">${track.instrumentos}</div></div>
            <div class="detail-box"><div class="detail-label">🎙️ Potência Vocal</div><div class="detail-value">${track.potenciaVocal}</div></div>
            <div class="detail-box"><div class="detail-label">💖 Sentimento</div><div class="detail-value">${track.sentimento}</div></div>
            <div class="detail-box"><div class="detail-label">🎯 Público-Alvo</div><div class="detail-value">${track.publico}</div></div>
            <div class="detail-box"><div class="detail-label">🚀 Potencial Onde Tocar</div><div class="detail-value">${track.potencial}</div></div>
            
            <div class="detail-box lyrics-box">
              <div class="lyrics-header">
                <div class="detail-label" style="margin: 0;">📜 Letra da Canção (Edite à vontade)</div>
                <button class="save-lyrics-btn" data-track="${track.id}">💾 Salvar Alterações</button>
              </div>
              <textarea class="lyrics-textarea" data-track="${track.id}" placeholder="Cole ou digite a letra completa aqui...">${currentLyric}</textarea>
            </div>
          </div>
        </td>
      `;

      tbody.appendChild(trTrack);
      tbody.appendChild(trAccordion);
    });
  }

  renderTable();

  const globalAudio = new Audio();
  let currentPlayingRow = null;

  function handleAudioPlay(row, audioSrc, playBtn) {
    if (currentPlayingRow === row) {
      if (globalAudio.paused) {
        globalAudio.play();
        playBtn.innerText = '⏸ Pausar';
        playBtn.classList.add('playing');
        row.classList.add('is-playing');
      } else {
        globalAudio.pause();
        playBtn.innerText = '▶ Tocar';
        playBtn.classList.remove('playing');
        row.classList.remove('is-playing');
      }
      return;
    }

    if (currentPlayingRow) {
      const prevBtn = currentPlayingRow.querySelector('.play-btn');
      if (prevBtn) {
        prevBtn.innerText = '▶ Tocar';
        prevBtn.classList.remove('playing');
      }
      currentPlayingRow.classList.remove('is-playing');
    }

    currentPlayingRow = row;
    globalAudio.src = audioSrc;
    globalAudio.play().then(() => {
      playBtn.innerText = '⏸ Pausar';
      playBtn.classList.add('playing');
      row.classList.add('is-playing');
    }).catch(err => {
      console.warn('Tentando formato alternativo (.mp3)...');
      // Fallback automático para .mp3 se .m4a falhar
      const mp3Fallback = audioSrc.replace('.m4a', '.mp3');
      globalAudio.src = mp3Fallback;
      globalAudio.play().then(() => {
        playBtn.innerText = '⏸ Pausar';
        playBtn.classList.add('playing');
        row.classList.add('is-playing');
      }).catch(err2 => {
        alert('Arquivo de áudio não encontrado na pasta.\nVerifique se o arquivo está nomeado exatamente como: ' + audioSrc);
        playBtn.innerText = '▶ Tocar';
        playBtn.classList.remove('playing');
        row.classList.remove('is-playing');
        currentPlayingRow = null;
      });
    });
  }

  globalAudio.addEventListener('ended', () => {
    if (currentPlayingRow) {
      const btn = currentPlayingRow.querySelector('.play-btn');
      if (btn) {
        btn.innerText = '▶ Tocar';
        btn.classList.remove('playing');
      }
      currentPlayingRow.classList.remove('is-playing');
      currentPlayingRow = null;
    }
  });

  tbody.addEventListener('click', (e) => {
    const saveBtn = e.target.closest('.save-lyrics-btn');
    if (saveBtn) {
      const trackId = saveBtn.getAttribute('data-track');
      const textarea = tbody.querySelector(`textarea[data-track="${trackId}"]`);
      if (textarea) {
        customLyrics[trackId] = textarea.value;
        localStorage.setItem(STORAGE_LYRICS, JSON.stringify(customLyrics));
        saveBtn.innerText = '✓ Salvo!';
        saveBtn.classList.add('saved');
        setTimeout(() => {
          saveBtn.innerText = '💾 Salvar Alterações';
          saveBtn.classList.remove('saved');
        }, 1800);
      }
      return;
    }

    if (e.target.closest('.lyrics-textarea')) {
      return;
    }

    const heartBtn = e.target.closest('.heart-btn');
    const playBtn = e.target.closest('.play-btn');
    const trackRow = e.target.closest('tr.track-row');
    if (!trackRow) return;

    const trackId = trackRow.getAttribute('data-id');
    const audioSrc = trackRow.getAttribute('data-audio');
    const accordionRow = tbody.querySelector(`tr.accordion-row[data-for="${trackId}"]`);

    if (heartBtn) {
      if (favorites.includes(trackId)) {
        favorites = favorites.filter(id => id !== trackId);
        heartBtn.innerText = '🤍';
        heartBtn.classList.remove('is-fav');
      } else {
        favorites.push(trackId);
        heartBtn.innerText = '❤️';
        heartBtn.classList.add('is-fav');
      }
      localStorage.setItem(STORAGE_FAVS, JSON.stringify(favorites));
      filterRows();
      return;
    }

    if (playBtn) {
      handleAudioPlay(trackRow, audioSrc, playBtn);
      return;
    }

    if (accordionRow) {
      const isOpen = accordionRow.classList.contains('open');

      tbody.querySelectorAll('tr.accordion-row.open').forEach(r => {
        if (r !== accordionRow) {
          r.classList.remove('open');
          const parentId = r.getAttribute('data-for');
          const parentRow = tbody.querySelector(`tr.track-row[data-id="${parentId}"]`);
          if (parentRow) parentRow.classList.remove('is-expanded');
        }
      });

      if (isOpen) {
        accordionRow.classList.remove('open');
        trackRow.classList.remove('is-expanded');
      } else {
        accordionRow.classList.add('open');
        trackRow.classList.add('is-expanded');
      }
    }
  });

  const searchInput = document.getElementById('searchInput');
  const toggleFavFilter = document.getElementById('toggleFavFilter');

  function filterRows() {
    const filter = searchInput.value.toLowerCase();
    const trackRows = tbody.querySelectorAll('tr.track-row');

    trackRows.forEach(row => {
      const trackId = row.getAttribute('data-id');
      const accRow = tbody.querySelector(`tr.accordion-row[data-for="${trackId}"]`);
      const matchesSearch = row.innerText.toLowerCase().includes(filter);
      const matchesFav = !onlyFavsActive || favorites.includes(trackId);

      if (matchesSearch && matchesFav) {
        row.style.display = '';
        if (accRow && row.classList.contains('is-expanded')) {
          accRow.style.display = 'table-row';
        }
      } else {
        row.style.display = 'none';
        if (accRow) accRow.style.display = 'none';
      }
    });
  }

  searchInput.addEventListener('input', filterRows);

  toggleFavFilter.addEventListener('click', () => {
    onlyFavsActive = !onlyFavsActive;
    toggleFavFilter.classList.toggle('active', onlyFavsActive);
    toggleFavFilter.innerText = onlyFavsActive ? '❤️ Mostrando Favoritas' : '❤️ Ver Apenas Favoritas';
    filterRows();
  });

  const headers = document.querySelectorAll('th[data-type]');
  headers.forEach((header) => {
    header.addEventListener('click', () => {
      const colIndex = Array.from(header.parentElement.children).indexOf(header);
      const isAsc = header.classList.contains('sorted-asc');
      const type = header.getAttribute('data-type');

      headers.forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
      header.classList.toggle('sorted-asc', !isAsc);
      header.classList.toggle('sorted-desc', isAsc);

      const trackRows = Array.from(tbody.querySelectorAll('tr.track-row'));

      trackRows.sort((rowA, rowB) => {
        if (type === 'fav') {
          const idA = rowA.getAttribute('data-id');
          const idB = rowB.getAttribute('data-id');
          const favA = favorites.includes(idA) ? 1 : 0;
          const favB = favorites.includes(idB) ? 1 : 0;
          return isAsc ? favA - favB : favB - favA;
        }

        let cellA = rowA.children[colIndex].innerText.replace('#', '').trim();
        let cellB = rowB.children[colIndex].innerText.replace('#', '').trim();

        if (type === 'number') {
          return isAsc
            ? parseFloat(cellA) - parseFloat(cellB)
            : parseFloat(cellB) - parseFloat(cellA);
        }

        return isAsc
          ? cellA.localeCompare(cellB, 'pt-BR')
          : cellB.localeCompare(cellA, 'pt-BR');
      });

      trackRows.forEach(row => {
        const id = row.getAttribute('data-id');
        const accRow = tbody.querySelector(`tr.accordion-row[data-for="${id}"]`);
        tbody.appendChild(row);
        if (accRow) tbody.appendChild(accRow);
      });
    });
  });
</script>
